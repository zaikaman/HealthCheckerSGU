name: Secrets Scan
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for potential secrets
        run: |
          echo "Scanning repository for potential secrets (excluding README files)..."
          if rg -n --no-ignore -S -i -g '!*README*' -e 'BEGIN PRIVATE KEY' -e 'AWS_ACCESS_KEY_ID' -e 'AWS_SECRET_ACCESS_KEY' -e 'SECRET' -e 'PASSWORD' -e 'API_KEY' -e 'ACCESS_TOKEN' -e 'SECRET_KEY'; then
            echo "Potential secrets found. Failing the build."
            exit 1
          else
            echo "No obvious secrets detected."
          fi
